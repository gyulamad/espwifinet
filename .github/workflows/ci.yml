name: CI

# Task #52 - run the automated test suite on every push and pull request.
#
# The whole suite lives in ./run_tests.sh: it installs the relay's npm
# dependencies when they are missing, runs the Node unit tests, the Node e2e
# test (real relay + simulated node over raw TCP) and the C++ firmware logic
# tests (g++ -std=gnu++17 against the stub Arduino headers), and exits
# non-zero when anything fails. g++ is preinstalled on ubuntu-latest runners,
# so no extra setup steps are needed beyond Node itself.

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

jobs:
  tests:
    name: Node unit + e2e + C++ logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nodejs/esp-relay/package-lock.json

      - name: Install the relay's npm dependencies
        working-directory: nodejs/esp-relay
        run: npm ci --no-audit --no-fund

      - name: Run the full test suite (unit + e2e + C++)
        run: ./run_tests.sh

      - name: Show the relay logs of a failed e2e run
        if: failure()
        run: |
          find nodejs/esp-relay -maxdepth 3 -name '*.log' -print -exec tail -n 50 {} \; || true
