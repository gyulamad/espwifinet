# ota.conf — the settings ota-deploy.sh needs to publish a firmware release
# (task #159). Copy this file to ota.conf and fill in the two values; ota.conf
# is gitignored (it carries the relay's API key).
#
# The relay's HTTP API base URL (the same one the dashboard talks to):
#RELAY_URL="http://127.0.0.1:8080"
#
# The shared secret the PHP dashboard sends as X-API-Key — the SAME value as
# relayKey in the relay's config.js:
#RELAY_KEY="CHANGE-ME-relay-key"
#
# The board identifiers, only if your boards differ from the defaults
# (arduino-cli board listall shows what your install has):
#FQBN_ESP8266="esp8266:esp8266:nodemcuv2"
#FQBN_ESP32="esp32:esp32:esp32"
